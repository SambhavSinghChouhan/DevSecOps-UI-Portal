version: "3.9"

services:

  backend:
    build:
      context: ./backend

    container_name: devsecops-backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    restart: always


  frontend:
    build:
      context: ./frontend

    container_name: devsecops-frontend

    ports:
      - "3000:3000"

    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000

    depends_on:
      - backend

    restart: always